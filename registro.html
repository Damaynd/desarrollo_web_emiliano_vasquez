<!DOCTYPE html>
<html lang = "es">

<head>
    <meta charset = "UTF-8">
    <title> Registro de usuarios </title>
    <link rel = "stylesheet" href = "assets/css/styles.css">
    <link rel = "stylesheet" href = "assets/css/navbar.css">
    <link rel = "stylesheet" href = "assets/css/forms.css">
</head>

<body>
<nav class = "navbar">
    <a href = "home.html"> Inicio </a>
    <a href = "registro.html"> Registro </a>
    <a href = "actividades.html"> Actividades </a>
    <a href = "miembros.html"> Miembros </a>
    <a href = "estadisticas.html"> Estadísticas </a>
    <a href = "contacto.html"> Contacto </a>
</nav>
<main>

    <h1> Registro de usuarios </h1>
    <h2> Complete los siguientes campos para crear su cuenta </h2>

    <form class = "formulario" id = "form-registro" action = "#" novalidate>

        <div>

            <label for = "name"> Nombre Completo*: </label>
            <input type = "text" name = "name" id = "name" required>
            <p class = "error-message" id = "error-name" hidden> </p>

        </div>

        <div>

            <label for = "rut"> Documento de identificación (RUT)*: </label>
            <input type = "text" name = "rut" id = "rut" required>
            <p class = "error-message" id = "error-rut" hidden></p>

        </div>

        <div>

            <label for = "email"> Dirección de correo electrónico*: </label>
            <input type = "email" name = "email" id = "email" required>
            <p class = "error-message" id = "error-email" hidden></p>

        </div>

        <div>

            <label for = "rol"> Seleccione su rol*: </label>
            <select name = "roles" id = "rol" required>
                <option value = ""> Seleccione una opción </option>
                <option value = "e_postgrado"> Estudiante post-grado </option>
                <option value = "e_pregrado"> Estudiante pre-grado </option>
                <option value = "docente"> Docente </option>
                <option value = "funcionario"> Funcionario/a </option>
            </select>
            <p class = "error-message" id = "error-rol" hidden></p>

        </div>

        <div id = "campo-carrera-container" style = "display: none;">

            <label for = "campo-carrera" id = "label-carrera"> Carrera o programa*: </label>
            <input type = "text" name = "campo-carrera" id = "campo-carrera">
            <p class = "error-message" id = "error-campo-carrera" hidden></p>

        </div>

        <div id = "campo-departamento-container" style = "display: none;">

            <label for = "campo-departamento" id="label-departamento"> Departamento o unidad*: </label>
            <input type = "text" name = "campo-departamento" id = "campo-departamento">
            <p class = "error-message" id = "error-campo-departamento" hidden></p>

        </div>

        <div>

            <label for = "password"> Contraseña*: </label>
            <input type = "password" name = "password" id = "password" required>
            <p class = "error-message" id = "error-password" hidden></p>

        </div>

        <div>

            <label for = "pw_confirmation"> Confirme su contraseña*: </label>
            <input type = "password" name = "pw_confirmation" id = "pw_confirmation" required>
            <p class = "error-message" id = "error-pw_confirmation" hidden></p>

        </div>

        <div class = "register-button">
        <input type = "submit" value = "Registrarme">
        </div>
    </form>
    <script src = "assets/js/registro.js" ></script>
</main>
</body>
</html>
