<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel = "stylesheet" href = "assets/css/styles.css">
    <link rel = "stylesheet" href = "assets/css/navbar.css">
    <link rel = "stylesheet" href = "assets/css/tables.css">

</head>
<body>
<nav class = "navbar">
    <a href = "index.html"> Inicio </a>
    <a href = "registro.html"> Registro </a>
    <a href = "actividades.html"> Actividades </a>
    <a href = "miembros.html"> Miembros </a>
    <a href = "estadisticas.html"> Estadísticas </a>
    <a href = "contacto.html"> Contacto </a>
</nav>
    <main>
        <h1>Listado de miembros</h1>
        <h2>Consulta de miembros registrados</h2>

        <section class = "filtros-miembros">
            <div>
                <label for = "filtro-tipo"> Filtrar por tipo: </label>
                <select id = "filtro-tipo">
                    <option value = "todos"> Todos </option>
                    <option value = "pregrado"> Estudiante de pregrado </option>
                    <option value = "postgrado"> Estudiante de postgrado </option>
                    <option value = "docente"> Docente </option>
                    <option value = "funcionario"> Funcionario/a </option>
                </select>
            </div>

            <div>
                <label for = "orden-miembros"> Ordenar por: </label>
                <select id = "orden-miembros">
                    <option value = "nombre-asc"> Nombre (A-Z) </option>
                    <option value = "nombre-desc"> Nombre (Z-A) </option>
                    <option value = "correo-asc"> Correo (A-Z) </option>
                    <option value = "correo-desc"> Correo (Z-A) </option>
                </select>
            </div>
        </section>

        <section class = "tabla-section">
            <table class = "tabla-miembros">
                <thead>
                    <tr>
                        <th> Nombre </th>
                        <th> Correo </th>
                        <th> Tipo </th>
                        <th> Información adicional </th>
                    </tr>
                </thead>
                <tbody id = "tabla-miembros-body"></tbody>
            </table>
        </section>

        <section class = "paginacion">
            <button id = "btn-anterior" type = "button"> Anterior </button>
            <span id = "pagina-actual"> Página 1 </span>
            <button id = "btn-siguiente" type = "button"> Siguiente </button>
        </section>
    </main>
</body>
</html>
